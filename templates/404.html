{% extends "base.html" %}
{% load static %}

{% block title %}
Page Not Found | SafeAlert
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="text-center py-5">

        <div class="mb-4">
            <img src="{% static 'images/safealert-404.png' %}" alt="SafeAlert" style="max-width: 180px;">
        </div>

        <h1 class="display-1 fw-bold">404</h1>

        <h2 class="mb-3">Page Not Found</h2>

        <p class="text-muted mb-4">
            Sorry, the page or report you are looking for could not be found.
        </p>

        <div class="d-flex justify-content-center gap-2 flex-wrap">

            <a href="{% url 'home' %}" class="btn btn-primary">
                Back to Home
            </a>

            {% if user.is_authenticated %}
            <a href="{% url 'my_reports' %}" class="btn btn-outline-primary">
                My Reports
            </a>
            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
