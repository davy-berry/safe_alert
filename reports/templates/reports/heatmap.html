<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafeAlert Heatmap</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>SafeAlert Heatmap</h1>

    <div id="map"></div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js">
    </script>

    <script>
        const map = L.map("map").setView(
            [52.4862, -1.8904],
            12
        );

        L.tileLayer(
            "https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png?api_key={{ stadia_api_key }}",
            {
                maxZoom: 20,
                attribution:
                    '&copy; <a href="https://stadiamaps.com/attribution/" target="_blank">Stadia Maps</a> ' +
                    '&copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> ' +
                    '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
            }
        ).addTo(map);


        const heatData = [
            {% for report in reports %}
                [
                    {{ report.latitude }},
                    {{ report.longitude }},
                    {{ report.risk_score|default:1 }}
                ],
            {% endfor %}
        ];


        L.heatLayer(
            heatData,
            {
                radius: 25,
                blur: 15,
                maxZoom: 17
            }
        ).addTo(map);
    </script>

</body>
</html>
